# Nginx: api.solodeck.cn -> FastAPI on 127.0.0.1:8787
# Install:
#   sudo cp solo_creator_agent/deploy/nginx-api-solodeck.conf /etc/nginx/sites-available/solodeck-api
#   sudo ln -sf /etc/nginx/sites-available/solodeck-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cloudflare DNS: api.solodeck.cn -> A record -> YOUR_VPS_PUBLIC_IP (proxied orange cloud OK)

server {
    listen 80;
    server_name api.solodeck.cn;

    client_max_body_size 200M;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
